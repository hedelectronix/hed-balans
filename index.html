const ZK_GS="/**\n * Hed zakaz \u2014 Google Sheets serveri (Google Apps Script veb-ilova)\n *\n * Sotuvchilar kompyuteridagi \u00abHed zakaz\u00bb shu skript orqali ishlaydi:\n *  - zakaz saqlanishi bilan Google Drive'dagi \u00abHed zakazlar\u00bb Google Sheets jadvaliga yoziladi;\n *  - mahsulot nomlari va narxlari HED kalkulyator jadvalidan (CSV havola) olinadi;\n *  - har kuni HOUR soatida o'sha kungi zakazlar Excel (.xlsx) fayl qilib Drive'ga saqlanadi va Telegram'ga yuboriladi.\n * Hed balans bilan bog'lash ixtiyoriy (pastdagi BALANS_\u2026): bog'lansa, zakaz oynasida balansdagi ostatka ko'rinadi,\n * zakaz balansga ham yoziladi va berilmagan zakaz ostatkani band qiladi. Hed balansda zakaz sotuvga aylantirilganda\n * ombor kamayadi va zakaz o'zi \u00abChiqarildi\u00bb bo'ladi.\n *\n * O'rnatish (bir marta):\n *  1. script.google.com \u2192 \u00abYangi loyiha\u00bb \u2192 shu kodni to'liq joylang va saqlang.\n *  2. Pastdagi CONFIG ni to'ldiring: PIN (kamida 6 belgi), KALKULYATOR_CSV, SOTUVCHILAR, BOT_TOKEN.\n *     BOT_TOKEN: Telegram'da @BotFather \u2192 /newbot \u2192 token; so'ng o'sha botga /start yozing.\n *  3. Yuqoridagi ro'yxatdan \u00absozlash\u00bb ni tanlab \u25b6 Run bosing va Google ruxsatlarini bering.\n *  4. \u00abDeploy\u00bb \u2192 \u00abNew deployment\u00bb \u2192 turi \u00abWeb app\u00bb; Execute as: \u00abMe\u00bb, Who has access: \u00abAnyone\u00bb \u2192 Deploy.\n *     Chiqqan \u00abWeb app URL\u00bb ni nusxalang.\n *  5. Har bir sotuvchi kompyuterida Hed zakazni oching, shu URL va PIN ni kiriting.\n * CONFIG ni o'zgartirsangiz: \u00abDeploy\u00bb \u2192 \u00abManage deployments\u00bb \u2192 \u270e \u2192 Version: \u00abNew version\u00bb \u2192 Deploy (URL o'zgarmaydi).\n */\nconst CONFIG = {\n  PIN: '',                         // sotuvchilar kompyuteriga kiritiladigan parol (kamida 6 belgi)\n  COMPANY: 'HED Electronix',       // hisobotdagi nom\n  CURRENCY: 'USD',                 // narxlar valyutasi: 'USD' yoki 'UZS'\n  KALKULYATOR_CSV: '',             // HED kalkulyator jadvali: Fayl \u2192 Ulashish \u2192 Internetda e'lon qilish \u2192 CSV havolasi\n  SOTUVCHILAR: [\"Ma'ruf\", 'Mirabbos', 'Muhammadamin'],\n  BOT_TOKEN: '',                   // @BotFather bergan token (hisobot Telegram'ga kelishi uchun)\n  FOLDER: 'Hed zakazlar',          // Google Drive'dagi papka\n  HOUR: 20,                        // kunlik hisobot soati (Toshkent vaqti, 0\u201323)\n  // --- Hed balans bilan bog'lash (ixtiyoriy; Hed balans \u2192 Sozlamalar \u2192 Zakazlar tayyor kodni beradi) ---\n  BALANS_URL: '',                  // Supabase loyiha manzili, masalan https://xxxx.supabase.co\n  BALANS_KEY: '',                  // publishable (ochiq) kalit\n  BALANS_SHOP_KEY: '',             // do'kon zakaz kaliti (hbz_\u2026)\n};\n\nvar TZ = 'Asia/Tashkent';\nvar BOSH = ['ID', 'Raqam', 'Sana', 'Vaqt', 'Sotuvchi', 'Mijoz', 'Telefon', \"To'lov\", 'Summa', 'Holat', 'Berilishi', 'Mahsulotlar', 'Izoh', 'Balans', 'Qatorlar'];\nvar QBOSH = ['ID', 'Raqam', 'Sana', 'Sotuvchi', 'Mijoz', \"To'lov\", 'Mahsulot', 'Soni', 'Narx', 'Summa', 'Manba', 'Holat'];\nvar C = { id: 0, no: 1, date: 2, time: 3, seller: 4, client: 5, phone: 6, pay: 7, total: 8, status: 9, deliv: 10, items: 11, note: 12, bal: 13, json: 14 };\nvar SS_ = null;\n\n/* ======================= O'RNATISH ======================= */\n\n/** Bir marta ishga tushiring: jadval ochiladi, kunlik hisobot va balans bilan sinxronlash yoqiladi. */\nfunction sozlash() {\n  if (String(CONFIG.PIN).length < 6) throw new Error('CONFIG.PIN ni kamida 6 belgi qilib yozing');\n  var ss = jadval_();\n  ScriptApp.getProjectTriggers().forEach(function (t) {\n    if (['kunlikHisobot', 'balansgaYubor'].indexOf(t.getHandlerFunction()) >= 0) ScriptApp.deleteTrigger(t);\n  });\n  ScriptApp.newTrigger('kunlikHisobot').timeBased().everyDays(1).atHour(CONFIG.HOUR).inTimezone(TZ).create();\n  if (boglangan_()) {\n    balans_('hb_zakaz_catalog', { p_key: CONFIG.BALANS_SHOP_KEY });   // manzil va kalit to'g'riligini tekshirish\n    ScriptApp.newTrigger('balansgaYubor').timeBased().everyMinutes(10).create();\n  }\n  if (CONFIG.BOT_TOKEN) {\n    telegramUlash_();\n    telegramXabar_('\u2705 Hed zakaz ulandi. Zakazlar jadvali: ' + ss.getUrl() + '\\nHar kuni soat ' + CONFIG.HOUR + ':00 da kunlik hisobot keladi.' +\n      (boglangan_() ? \"\\nHed balans bilan bog'langan.\" : ''));\n  }\n  console.log('Tayyor. Jadval: ' + ss.getUrl() + ' \u2014 endi Deploy \u2192 Web app qiling.');\n  return ss.getUrl();\n}\n\n/* ======================= VEB-ILOVA ======================= */\n\nfunction doGet() {\n  return ContentService.createTextOutput('Hed zakaz serveri ishlayapti. Bu manzilni Hed zakaz ilovasiga kiriting.');\n}\n\nfunction doPost(e) {\n  var out;\n  try {\n    var b = JSON.parse((e && e.postData && e.postData.contents) || '{}');\n    pin_(b.pin);\n    if (b.a === 'init') out = init_();\n    else if (b.a === 'order') out = zakazYoz_(b.order);\n    else if (b.a === 'list') out = royxat_(b.date);\n    else if (b.a === 'cancel') out = bekor_(b.id, b.note);\n    else if (b.a === 'deliver') out = chiqarildi_(b.id, !!b.on);\n    else throw new Error(\"Noma'lum so'rov\");\n    out.ok = true;\n  } catch (err) {\n    var m = String((err && err.message) || err);\n    // vaqtinchalik xato (qulf, Google xizmati band, balansga ulanib bo'lmadi) \u2014 ilova keyin qayta yuboradi\n    var temp = !!(err && err.tarmoq) || /lock|timed out|timeout|Service|Too many|Exceeded|try again|vaqtincha|ulanib bo'lmadi/i.test(m);\n    out = { ok: false, error: m, auth: !!(err && err.auth), temp: temp };\n  }\n  return ContentService.createTextOutput(JSON.stringify(out)).setMimeType(ContentService.MimeType.JSON);\n}\n\nfunction pin_(p) {\n  var c = CacheService.getScriptCache();\n  var e;\n  if (String(CONFIG.PIN).length < 6) { e = new Error('Serverda PIN sozlanmagan (CONFIG.PIN)'); e.auth = true; throw e; }\n  if (String(p || '') === String(CONFIG.PIN)) return;          // to'g'ri PIN doim o'tadi (begona odam sotuvchilarni bloklay olmaydi)\n  var bad = Number(c.get('pinBad') || 0) + 1;\n  c.put('pinBad', String(bad), 600);\n  if (bad > 20) Utilities.sleep(3000);                          // ko'p noto'g'ri urinish \u2014 har biri sekinlashadi (PIN terib topishni qiyinlashtiradi)\n  e = new Error(\"PIN noto'g'ri\"); e.auth = true; throw e;\n}\n\nfunction init_() {\n  var r = { company: CONFIG.COMPANY, currency: CONFIG.CURRENCY, sellers: (CONFIG.SOTUVCHILAR || []).filter(String), today: bugun_(),\n    linked: boglangan_(), calcCsv: '', calcErr: '', products: [], clients: [] };\n  try { r.calcCsv = kalkulyator_(); } catch (e) { r.calcErr = String(e.message || e); }\n  if (r.linked) {\n    try {\n      var k = balans_('hb_zakaz_catalog', { p_key: CONFIG.BALANS_SHOP_KEY });\n      r.company = k.shop || r.company; r.currency = k.base || r.currency; r.rate = k.rate; r.minPriceCheck = k.minPriceCheck;\n      r.products = k.products || []; r.clients = k.clients || [];\n    } catch (e) { r.balansErr = String(e.message || e); }\n  }\n  return r;\n}\n\nfunction kalkulyator_() {\n  var url = String(CONFIG.KALKULYATOR_CSV || '').trim();\n  if (!url) return '';\n  if (!/^https:\\/\\//.test(url)) throw new Error('KALKULYATOR_CSV https:// bilan boshlanishi kerak');\n  var c = CacheService.getScriptCache(), key = 'calc_' + Utilities.base64EncodeWebSafe(Utilities.computeDigest(Utilities.DigestAlgorithm.MD5, url));\n  var t = c.get(key);\n  if (t) return t;\n  var r = UrlFetchApp.fetch(url, { muteHttpExceptions: true, followRedirects: true });\n  if (r.getResponseCode() !== 200) throw new Error('Kalkulyator jadvali ochilmadi (' + r.getResponseCode() + ')');\n  t = r.getContentText('UTF-8');\n  if (/^\\s*<(!doctype|html)/i.test(t)) throw new Error(\"Kalkulyator havolasi CSV emas \u2014 \u00abInternetda e'lon qilish\u00bb \u2192 CSV havolasini qo'ying\");\n  try { if (t.length < 90000) c.put(key, t, 600); } catch (e) {}   // 100 KB dan katta bo'lsa keshlanmaydi\n  return t;\n}\n\n/* ======================= ZAKAZLAR ======================= */\n\nfunction zakazYoz_(o) {\n  if (!o || typeof o !== 'object') throw new Error(\"Noto'g'ri so'rov\");\n  if (!/^[A-Za-z0-9_-]{4,64}$/.test(String(o.id || ''))) throw new Error(\"Zakaz raqami noto'g'ri\");\n  var pay = o.pay === 'debt' ? 'debt' : (o.pay === 'cash' ? 'cash' : null);\n  if (!pay) throw new Error(\"To'lov turi noto'g'ri\");\n  var seller = toza_(o.seller, 60);\n  if ((CONFIG.SOTUVCHILAR || []).filter(String).length && !seller) throw new Error('Sotuvchini tanlang yoki ismini yozing');\n  var client = toza_(o.client, 120), phone = toza_(o.phone, 40), note = toza_(o.note, 500), cid = toza_(o.cid, 64);\n  if (pay === 'debt' && !client && !cid) throw new Error('Qarzga berilganda mijozni tanlang yoki ismini yozing');\n  if (!Array.isArray(o.lines) || !o.lines.length) throw new Error(\"Zakazda mahsulot yo'q\");\n  if (o.lines.length > 300) throw new Error(\"Zakazda mahsulot juda ko'p\");\n  var lines = o.lines.map(function (l) {\n    l = l || {};\n    var name = toza_(l.name, 200), q = son_(l.qty), p = son_(l.price);\n    if (name.length < 2) throw new Error('Mahsulot nomini yozing (2\u2013200 belgi)');\n    if (!(q > 0)) throw new Error('\"' + name + '\" soni musbat bo\\'lishi kerak');\n    if (Math.round(q) !== q && !(l.pid && /^(kg|litr|metr|m)$/i.test(String(l.unit || '')))) throw new Error('\"' + name + '\" soni butun son bo\\'lishi kerak');\n    if (!(p > 0)) throw new Error('\"' + name + '\" narxini kiriting');\n    var x = { name: name, qty: q, price: Math.round(p * 10000) / 10000, sum: Math.round(q * p * 100) / 100, src: ['calc', 'manual'].indexOf(l.src) >= 0 ? l.src : (l.pid ? 'balans' : 'manual') };\n    if (l.pid) x.pid = String(l.pid).slice(0, 64);\n    if (l.cat) x.cat = toza_(l.cat, 60);\n    return x;\n  });\n  var total = Math.round(lines.reduce(function (a, l) { return a + l.sum; }, 0) * 100) / 100;\n\n  var lock = LockService.getScriptLock();\n  lock.waitLock(30000);\n  try {\n    var sh = varaq_('Zakazlar');\n    var bor = topRow_(sh, o.id);\n    if (bor) {   // takroriy yuborish (internet uzilib qayta yuborilganda) \u2014 ikki marta yozilmaydi\n      var v = sh.getRange(bor, 1, 1, BOSH.length).getValues()[0];\n      qatorlarYoz_(qatorRows_(qatorZakaz_(v)));                // oldingi urinishda qatorlar yozilmay qolgan bo'lsa\n      return { order: { id: o.id, no: String(v[C.no]), total: Number(v[C.total]), date: String(v[C.date]), balans: String(v[C.bal] || '') } };\n    }\n    var d = sana_(o.date);\n    var no = raqam_(d);\n    var balans = '';\n    if (boglangan_()) {\n      try {\n        var br = balans_('hb_zakaz_order', { p_key: CONFIG.BALANS_SHOP_KEY, p_order: balansZakaz_({ id: o.id, no: no, date: d, seller: seller, pay: pay, cid: cid, client: client, phone: phone, note: note, lines: lines }) });\n        balans = 'Yozildi';\n        if (br && br.no) no = br.no;\n        if (br && br.client && cid) { client = br.client; phone = br.phone || phone; }\n      } catch (e) {\n        if (!e.tarmoq) throw e;               // balans rad etdi (masalan, minimal narx) \u2014 zakaz saqlanmaydi\n        balans = 'Kutilmoqda';                // balansga ulanib bo'lmadi \u2014 jadvalga yoziladi, keyin avtomatik yuboriladi\n      }\n    }\n    var vaqt = Utilities.formatDate(new Date(), TZ, 'HH:mm');\n    var tl = pay === 'debt' ? 'Qarzga' : 'Naqd olindi';\n    sh.appendRow(xavfsiz_([o.id, no, d, vaqt, seller, client, phone, tl, total, 'Faol', 'Berilmagan',\n      lines.map(function (l) { return l.name + ' \u00d7 ' + l.qty; }).join(', '), note, balans, JSON.stringify({ lines: lines, cid: cid })]));\n    qatorlarYoz_(qatorRows_({ id: o.id, no: no, date: d, seller: seller, client: client, pay: pay, status: 'new', lines: lines }));\n    return { order: { id: o.id, no: no, total: total, date: d, balans: balans } };\n  } finally { yopish_(lock); }\n}\n\nfunction qatorRows_(o) {\n  var tl = o.pay === 'debt' ? 'Qarzga' : 'Naqd olindi';\n  return o.lines.map(function (l) { return xavfsiz_([o.id, o.no, o.date, o.seller, o.client, tl, l.name, l.qty, l.price, l.sum != null ? l.sum : Math.round(l.qty * l.price * 100) / 100,\n    l.src === 'calc' ? 'Kalkulyator' : l.src === 'balans' ? 'Balans katalogi' : \"Qo'lda\", o.status === 'cancelled' ? 'Bekor qilingan' : 'Faol']); });\n}\n\n// \u00abQatorlar\u00bb varag'iga yozish (shu zakaz qatorlari hali yo'q bo'lsa); varaq to'lsa yangi qatorlar qo'shiladi\nfunction qatorlarYoz_(rows) {\n  if (!rows.length) return;\n  var q = varaq_('Qatorlar'), id = String(rows[0][0]);\n  if (idQatorlar_(q, 0, id).length) return;\n  var at = q.getLastRow() + 1, need = at + rows.length - 1 - q.getMaxRows();\n  if (need > 0) q.insertRowsAfter(q.getMaxRows(), need + 100);\n  q.getRange(at, 1, rows.length, QBOSH.length).setValues(rows);\n}\n\nfunction yopish_(lock) { try { SpreadsheetApp.flush(); } finally { lock.releaseLock(); } }\n\nfunction balansZakaz_(o) {\n  return { id: o.id, no: o.no, date: o.date, seller: o.seller, pay: o.pay, cid: o.cid || null, client: o.cid ? '' : o.client, phone: o.cid ? '' : o.phone, note: o.note,\n    lines: o.lines.map(function (l) { return l.pid ? { pid: l.pid, name: l.name, qty: l.qty, price: l.price } : { src: l.src === 'calc' ? 'calc' : 'manual', cat: l.cat || '', name: l.name, qty: l.qty, price: l.price }; }) };\n}\n\nfunction royxat_(d) {\n  d = /^\\d{4}-\\d{2}-\\d{2}$/.test(String(d || '')) ? d : bugun_();\n  var sinx = '';\n  if (boglangan_()) { try { holatSinx_(d); } catch (e) { sinx = String(e.message || e); } }\n  return { date: d, orders: kunZakazlari_(d), linked: boglangan_(), syncErr: sinx };\n}\n\nfunction bekor_(id, note) {\n  var lock = LockService.getScriptLock(); lock.waitLock(30000);\n  try {\n    var sh = varaq_('Zakazlar'), r = topRow_(sh, id);\n    if (!r) throw new Error('Zakaz topilmadi');\n    var v = sh.getRange(r, 1, 1, BOSH.length).getValues()[0];\n    if (v[C.status] === 'Bekor qilingan') return { order: qatorZakaz_(v) };\n    if (v[C.deliv] === 'Chiqarildi') throw new Error(\"Tovar chiqarib berilgan zakazni bekor qilib bo'lmaydi\");\n    if (boglangan_() && v[C.bal] && v[C.bal] !== 'Kutilmoqda' && String(v[C.bal]).indexOf('Xato') !== 0) {\n      try { balans_('hb_zakaz_cancel', { p_key: CONFIG.BALANS_SHOP_KEY, p_id: String(id), p_note: toza_(note, 300) }); }\n      catch (e) { if (e.tarmoq) throw new Error(\"Hed balansga ulanib bo'lmadi \u2014 keyinroq qayta urinib ko'ring\"); throw e; }\n    }\n    sh.getRange(r, C.status + 1).setValue('Bekor qilingan');\n    if (note) { v[C.note] = (v[C.note] ? v[C.note] + ' | ' : '') + 'Bekor: ' + toza_(note, 300); sh.getRange(r, C.note + 1).setValue(xavfsiz_([v[C.note]])[0]); }\n    qatorHolat_(id, 'Bekor qilingan');\n    v[C.status] = 'Bekor qilingan';\n    return { order: qatorZakaz_(v) };\n  } finally { yopish_(lock); }\n}\n\nfunction chiqarildi_(id, on) {\n  if (boglangan_()) throw new Error(\"Hed balans bilan bog'langan: zakaz Hed balansda sotuvga aylantirilganda o'zi \u00abChiqarildi\u00bb bo'ladi\");\n  var lock = LockService.getScriptLock(); lock.waitLock(30000);\n  try {\n    var sh = varaq_('Zakazlar'), r = topRow_(sh, id);\n    if (!r) throw new Error('Zakaz topilmadi');\n    var v = sh.getRange(r, 1, 1, BOSH.length).getValues()[0];\n    if (v[C.status] === 'Bekor qilingan') throw new Error('Bekor qilingan zakaz');\n    v[C.deliv] = on ? 'Chiqarildi' : 'Berilmagan';\n    sh.getRange(r, C.deliv + 1).setValue(v[C.deliv]);\n    return { order: qatorZakaz_(v) };\n  } finally { yopish_(lock); }\n}\n\n/** Balansga ulanib bo'lmagan paytda yozilgan zakazlarni qayta yuborish (har 10 daqiqada avtomatik). */\nfunction balansgaYubor() {\n  if (!boglangan_()) return 0;\n  var lock = LockService.getScriptLock(); if (!lock.tryLock(10000)) return 0;\n  var todo = [];\n  try {\n    var all = varaq_('Zakazlar').getDataRange().getValues();\n    for (var i = 1; i < all.length; i++) if (all[i][C.bal] === 'Kutilmoqda') todo.push(all[i]);\n  } finally { lock.releaseLock(); }\n  var n = 0;\n  for (var k = 0; k < todo.length; k++) {\n    var v = todo[k], o = qatorZakaz_(v), holat = 'Yozildi', yangiNo = null;\n    var j = {}; try { j = JSON.parse(v[C.json] || '{}'); } catch (e) {}\n    try {\n      var br = balans_('hb_zakaz_order', { p_key: CONFIG.BALANS_SHOP_KEY, p_order: balansZakaz_({ id: o.id, no: o.no, date: o.date, seller: o.seller, pay: o.pay, cid: j.cid || '', client: o.client, phone: o.phone, note: o.note, lines: o.lines }) });\n      if (br && br.no && br.no !== o.no) yangiNo = br.no;           // balans boshqa raqam bergan bo'lsa \u2014 jadval ham shu raqamga o'tadi\n      if (o.status === 'cancelled') {\n        try { balans_('hb_zakaz_cancel', { p_key: CONFIG.BALANS_SHOP_KEY, p_id: o.id, p_note: 'Hed zakazda bekor qilingan' }); }\n        catch (e2) { if (e2.tarmoq) holat = 'Kutilmoqda'; else holat = 'Xato: ' + String(e2.message || e2).slice(0, 120); }\n      }\n    } catch (e) {\n      if (e.tarmoq) break;\n      holat = 'Xato: ' + String(e.message || e).slice(0, 120);\n    }\n    var lk = LockService.getScriptLock(); lk.waitLock(30000);\n    try {\n      var sh = varaq_('Zakazlar'), r = topRow_(sh, o.id);\n      if (!r) continue;\n      if (yangiNo) {\n        sh.getRange(r, C.no + 1).setValue(yangiNo);\n        var q = varaq_('Qatorlar'); idQatorlar_(q, 0, o.id).forEach(function (qr) { q.getRange(qr, 2).setValue(yangiNo); });\n      }\n      sh.getRange(r, C.bal + 1).setValue(holat); n++;\n    } finally { yopish_(lk); }\n  }\n  return n;\n}\n\n/** Bog'langan rejimda: balansdagi holat (chiqarildi / bekor / sotuv raqami) jadvalga ko'chiriladi. */\nfunction holatSinx_(d) {\n  var ex = balans_('hb_orders_export', { p_key: CONFIG.BALANS_SHOP_KEY, p_date: d });\n  var m = {}; (ex.orders || []).forEach(function (o) { m[o.id] = o; });\n  var lock = LockService.getScriptLock(); lock.waitLock(30000);\n  try {\n    var sh = varaq_('Zakazlar'), all = sh.getDataRange().getValues();\n    for (var i = 1; i < all.length; i++) {\n      var v = all[i], o = m[String(v[C.id])]; if (!o || String(v[C.date]) !== d) continue;\n      if (v[C.bal] === 'Kutilmoqda' || String(v[C.bal]).indexOf('Xato') === 0) continue;   // hali yuborilmagan yoki xato \u2014 balansgaYubor hal qiladi\n      if (v[C.status] === 'Bekor qilingan' && o.status !== 'cancelled') continue;            // jadvalda bekor qilingan \u2014 qaytarilmaydi\n      var st = o.status === 'cancelled' ? 'Bekor qilingan' : 'Faol', dl = o.delivered ? 'Chiqarildi' : 'Berilmagan', bl = o.saleNo ? 'Sotuv ' + o.saleNo : 'Yozildi';\n      if (v[C.status] !== st) { sh.getRange(i + 1, C.status + 1).setValue(st); qatorHolat_(String(v[C.id]), st); }\n      if (v[C.deliv] !== dl) sh.getRange(i + 1, C.deliv + 1).setValue(dl);\n      if (v[C.bal] !== bl) sh.getRange(i + 1, C.bal + 1).setValue(bl);\n      if (o.no && o.no !== String(v[C.no])) {\n        sh.getRange(i + 1, C.no + 1).setValue(o.no);\n        var q = varaq_('Qatorlar'); idQatorlar_(q, 0, String(v[C.id])).forEach(function (qr) { q.getRange(qr, 2).setValue(o.no); });\n      }\n    }\n  } finally { yopish_(lock); }\n}\n\nfunction kunZakazlari_(d) {\n  var all = varaq_('Zakazlar').getDataRange().getValues();\n  var r = [];\n  for (var i = 1; i < all.length; i++) if (String(all[i][C.date]) === d) r.push(qatorZakaz_(all[i]));\n  return r;\n}\n\nfunction qatorZakaz_(v) {\n  var j = {}; try { j = JSON.parse(v[C.json] || '{}'); } catch (e) {}\n  return { id: String(v[C.id]), no: String(v[C.no]), date: String(v[C.date]), time: String(v[C.time] || ''), seller: String(v[C.seller] || ''), client: String(v[C.client] || ''),\n    phone: String(v[C.phone] || ''), pay: v[C.pay] === 'Qarzga' ? 'debt' : 'cash', total: Number(v[C.total]) || 0, status: v[C.status] === 'Bekor qilingan' ? 'cancelled' : 'new',\n    delivered: v[C.deliv] === 'Chiqarildi', note: String(v[C.note] || ''), balans: String(v[C.bal] || ''), lines: j.lines || [] };\n}\n\nfunction qatorHolat_(id, holat) {\n  var q = varaq_('Qatorlar');\n  idQatorlar_(q, 0, id).forEach(function (r) { q.getRange(r, QBOSH.length).setValue(holat); });\n}\n\n/* ======================= KUNLIK HISOBOT ======================= */\n\n/** Bugungi (yoki berilgan sana, 'YYYY-MM-DD') zakazlar hisoboti: Drive'ga Excel va Google Sheets, Telegram'ga Excel. */\nfunction kunlikHisobot(sana) {\n  var qolda = (typeof sana === 'string' && /^\\d{4}-\\d{2}-\\d{2}$/.test(sana));\n  var d = qolda ? sana : bugun_();\n  // avtomatik ishga tushganda: kechagi hisobotdan keyin kechaga yangi zakaz qo'shilgan bo'lsa (kech soatda yoki internetsiz yozilgan), kechagi fayl yangilanadi\n  if (!qolda) { try { kechaniTekshir_(d); } catch (e) { console.error(e); } }\n  return hisobot_(d, false);\n}\n\nfunction kechaniTekshir_(bugun) {\n  var t = new Date(bugun + 'T12:00:00+05:00'); t.setDate(t.getDate() - 1);\n  var k = Utilities.formatDate(t, TZ, 'yyyy-MM-dd');\n  var eski = PropertiesService.getScriptProperties().getProperty('SIG_' + k);\n  if (eski === null) return;               // kecha hisobot qilinmagan \u2014 tegmaymiz\n  if (boglangan_()) { try { holatSinx_(k); } catch (e) {} }\n  var data = { orders: kunZakazlari_(k) };\n  if (imzo_(data.orders) !== eski) hisobot_(k, true, data);\n}\n\nfunction imzo_(orders) {\n  return orders.map(function (o) { return o.id + ':' + o.status + ':' + o.total + ':' + (o.delivered ? 1 : 0); }).sort().join('|');\n}\n\nfunction hisobot_(d, yangilangan, oldin) {\n  var data = oldin;\n  if (!data) {\n    if (boglangan_()) { try { holatSinx_(d); } catch (e) { console.error(e); } }\n    data = { orders: kunZakazlari_(d) };\n  }\n  var all = data.orders || [];\n  PropertiesService.getScriptProperties().setProperty('SIG_' + d, imzo_(all));\n  var act = all.filter(function (o) { return o.status !== 'cancelled'; });\n  var cur = CONFIG.CURRENCY || 'USD';\n  var sanaUz = d.split('-').reverse().join('.');\n  var nom = 'Zakazlar ' + d;\n  var papka = papka_();\n  var eski = papka.getFilesByName(nom);\n  while (eski.hasNext()) eski.next().setTrashed(true);\n  var eskiX = papka.getFilesByName(nom + '.xlsx');\n  while (eskiX.hasNext()) eskiX.next().setTrashed(true);\n  if (!act.length) {\n    var bugunmi = d === bugun_();\n    telegramXabar_('\ud83d\udce6 ' + CONFIG.COMPANY + ' \u2014 ' + sanaUz + (yangilangan ? ' (yangilangan)' : '') + '\\n' + (bugunmi ? 'Bugun' : 'Shu kuni') + \" zakaz bo'lmadi.\" + (all.length ? ' (bekor qilingan: ' + all.length + ')' : ''));\n    return null;\n  }\n\n  var ss = SpreadsheetApp.create(nom);\n  DriveApp.getFileById(ss.getId()).moveTo(papka);\n  var fmt = cur === 'UZS' ? '#,##0' : '#,##0.00';\n  var tolov = function (o) { return o.pay === 'debt' ? 'Qarzga' : 'Naqd olindi'; };\n\n  // 1) Zakazlar\n  var z = [['Raqam', 'Vaqt', 'Sotuvchi', 'Mijoz', 'Telefon', \"To'lov\", 'Summa', 'Holat', 'Berilishi', 'Mahsulotlar', 'Izoh']];\n  all.forEach(function (o) {\n    z.push([o.no, o.time || '', o.seller || '', o.client || 'Naqd mijoz', o.phone || '', tolov(o), Number(o.total),\n      o.status === 'cancelled' ? 'Bekor qilingan' : 'Faol',\n      o.status === 'cancelled' ? '' : (o.delivered ? 'Chiqarildi' : 'Berilmagan'),\n      (o.lines || []).map(function (l) { return l.name + ' \u00d7 ' + l.qty; }).join(', '), o.note || '']);\n  });\n  hisobotVaraq_(ss.getSheets()[0], 'Zakazlar', z, [7], fmt);\n\n  // 2) Qatorlar (har bir mahsulot alohida qatorda)\n  var q = [['Raqam', 'Sotuvchi', 'Mijoz', \"To'lov\", 'Mahsulot', 'Soni', 'Narx', 'Summa']];\n  act.forEach(function (o) {\n    (o.lines || []).forEach(function (l) {\n      q.push([o.no, o.seller || '', o.client || 'Naqd mijoz', tolov(o), l.name, Number(l.qty), Number(l.price), Number(l.sum != null ? l.sum : l.qty * l.price)]);\n    });\n  });\n  hisobotVaraq_(ss.insertSheet(), 'Qatorlar', q, [7, 8], fmt);\n\n  // 3) Mahsulotlar bo'yicha jami (ombordan yig'ish uchun)\n  var pm = {};\n  act.forEach(function (o) { (o.lines || []).forEach(function (l) {\n    var k = l.pid || String(l.name).toLowerCase(); if (!pm[k]) pm[k] = { name: l.name, qty: 0, sum: 0 };\n    pm[k].qty += Number(l.qty); pm[k].sum += Number(l.sum != null ? l.sum : l.qty * l.price);\n  }); });\n  var m = [['Mahsulot', 'Jami soni', 'Summa']];\n  Object.keys(pm).map(function (k) { return pm[k]; }).sort(function (a, b) { return b.qty - a.qty; })\n    .forEach(function (x) { m.push([x.name, x.qty, Math.round(x.sum * 100) / 100]); });\n  hisobotVaraq_(ss.insertSheet(), 'Mahsulotlar jami', m, [3], fmt);\n\n  // 4) Sotuvchilar bo'yicha\n  var am = {};\n  act.forEach(function (o) {\n    var k = o.seller || '\u2014'; if (!am[k]) am[k] = { n: 0, cash: 0, debt: 0 };\n    am[k].n++; am[k][o.pay === 'debt' ? 'debt' : 'cash'] += Number(o.total);\n  });\n  var a = [['Sotuvchi', 'Zakazlar', 'Naqd olindi', 'Qarzga', 'Jami']];\n  Object.keys(am).sort().forEach(function (k) { var x = am[k]; a.push([k, x.n, x.cash, x.debt, x.cash + x.debt]); });\n  hisobotVaraq_(ss.insertSheet(), 'Sotuvchilar', a, [3, 4, 5], fmt);\n  SpreadsheetApp.flush();\n\n  // Excel (.xlsx) nusxasi Drive'ga va Telegram'ga\n  var xlsx = UrlFetchApp.fetch('https://docs.google.com/spreadsheets/d/' + ss.getId() + '/export?format=xlsx', {\n    headers: { Authorization: 'Bearer ' + ScriptApp.getOAuthToken() }, muteHttpExceptions: true,\n  });\n  if (xlsx.getResponseCode() !== 200) throw new Error(\"Excel faylga aylantirib bo'lmadi: \" + xlsx.getResponseCode());\n  var blob = xlsx.getBlob().setName(nom + '.xlsx');\n  papka.createFile(blob);\n\n  var naqd = act.filter(function (o) { return o.pay !== 'debt'; }).reduce(function (s, o) { return s + Number(o.total); }, 0);\n  var qarz = act.filter(function (o) { return o.pay === 'debt'; }).reduce(function (s, o) { return s + Number(o.total); }, 0);\n  var izoh = '\ud83d\udce6 ' + CONFIG.COMPANY + ' \u2014 ' + sanaUz + ' zakazlari' + (yangilangan ? \" (yangilangan: kech kelgan zakazlar qo'shildi)\" : '') + '\\n' +\n    'Zakazlar: ' + act.length + (all.length > act.length ? ' (bekor: ' + (all.length - act.length) + ')' : '') + '\\n' +\n    'Naqd olindi: ' + pul_(naqd, cur) + '\\n' +\n    'Qarzga: ' + pul_(qarz, cur) + '\\n' +\n    'Jami: ' + pul_(naqd + qarz, cur) + '\\n' +\n    'Chiqarildi: ' + act.filter(function (o) { return o.delivered; }).length + ', hali berilmagan: ' + act.filter(function (o) { return !o.delivered; }).length + '\\n' +\n    'Google Sheets: ' + ss.getUrl();\n  telegramFayl_(blob, izoh);\n  return ss.getUrl();\n}\n\nfunction hisobotVaraq_(sh, nom, rows, pulUstun, fmt) {\n  sh.setName(nom);\n  var safe = rows.map(function (r, i) { return i === 0 ? r : xavfsiz_(r); });\n  sh.getRange(1, 1, safe.length, safe[0].length).setValues(safe);\n  sh.getRange(1, 1, 1, rows[0].length).setFontWeight('bold').setBackground('#E6E8EB');\n  sh.setFrozenRows(1);\n  if (rows.length > 1) pulUstun.forEach(function (c) { sh.getRange(2, c, rows.length - 1, 1).setNumberFormat(fmt); });\n  sh.autoResizeColumns(1, rows[0].length);\n}\n\n/* ======================= YORDAMCHI ======================= */\n\nfunction boglangan_() { return !!(CONFIG.BALANS_URL && CONFIG.BALANS_KEY && /^hbz_[0-9a-f]{64}$/.test(String(CONFIG.BALANS_SHOP_KEY))); }\n\nfunction balans_(fn, args) {\n  var r;\n  try {\n    r = UrlFetchApp.fetch(String(CONFIG.BALANS_URL).replace(/\\/$/, '') + '/rest/v1/rpc/' + fn, {\n      method: 'post', contentType: 'application/json', muteHttpExceptions: true,\n      headers: { apikey: CONFIG.BALANS_KEY }, payload: JSON.stringify(args),\n    });\n  } catch (e) { var ne = new Error(\"Hed balansga ulanib bo'lmadi: \" + (e.message || e)); ne.tarmoq = true; throw ne; }\n  var code = r.getResponseCode(), t = r.getContentText();\n  if (code >= 200 && code < 300) return JSON.parse(t || 'null');\n  var msg = t; try { msg = JSON.parse(t).message || t; } catch (e) {}\n  var err = new Error(String(msg).slice(0, 300));\n  if (code >= 500 || code === 408 || code === 429) err.tarmoq = true;   // server vaqtincha ishlamayapti \u2014 keyin qayta yuboriladi\n  throw err;\n}\n\nfunction jadval_() {\n  if (SS_) return SS_;\n  var p = PropertiesService.getScriptProperties(), id = p.getProperty('SHEET_ID'), ss = null;\n  if (id) { try { ss = DriveApp.getFileById(id).isTrashed() ? null : SpreadsheetApp.openById(id); } catch (e) { ss = null; } }\n  if (!ss) {\n    ss = SpreadsheetApp.create('Hed zakazlar');\n    DriveApp.getFileById(ss.getId()).moveTo(papka_());\n    ss.getSheets()[0].setName('Zakazlar');\n    p.setProperty('SHEET_ID', ss.getId());\n  }\n  [['Zakazlar', BOSH], ['Qatorlar', QBOSH]].forEach(function (x) {\n    var sh = ss.getSheetByName(x[0]) || ss.insertSheet(x[0]);\n    if (sh.getLastRow() === 0) {\n      sh.getRange('A:Z').setNumberFormat('@');               // sana, telefon va raqamlar matn bo'lib qoladi\n      sh.getRange(1, 1, 1, x[1].length).setValues([x[1]]).setFontWeight('bold').setBackground('#E6E8EB');\n      sh.setFrozenRows(1);\n      if (x[0] === 'Zakazlar') { sh.getRange('I:I').setNumberFormat('#,##0.00'); sh.hideColumns(1); sh.hideColumns(BOSH.length); }\n      else { sh.getRange('H:J').setNumberFormat('#,##0.##'); sh.hideColumns(1); }\n    }\n  });\n  SS_ = ss;\n  return ss;\n}\n\nfunction varaq_(nom) { return jadval_().getSheetByName(nom); }\n\nfunction topRow_(sh, id) { var r = idQatorlar_(sh, 0, id); return r.length ? r[0] : 0; }\n\n// ustundagi qiymati aynan id ga teng qatorlar raqamlari (1 dan boshlab; sarlavha hisobga olinmaydi)\nfunction idQatorlar_(sh, col, id) {\n  var n = sh.getLastRow(); if (n < 2) return [];\n  var v = sh.getRange(2, col + 1, n - 1, 1).getValues(), r = [];\n  for (var i = 0; i < v.length; i++) if (String(v[i][0]) === String(id)) r.push(i + 2);\n  return r;\n}\n\nfunction raqam_(d) {\n  var p = PropertiesService.getScriptProperties(), k = 'N_' + d, n = Number(p.getProperty(k) || 0) + 1;\n  p.setProperty(k, String(n));\n  return 'Z-' + d.slice(2).replace(/-/g, '') + '-' + n;\n}\n\nfunction bugun_() { return Utilities.formatDate(new Date(), TZ, 'yyyy-MM-dd'); }\n\n// internetsiz yozilib keyin yuborilgan zakaz o'z kuni bilan yoziladi (ko'pi bilan 7 kun oldin, kelajak emas)\nfunction sana_(d) {\n  var b = bugun_();\n  if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(String(d || ''))) return b;\n  var t = new Date(b + 'T12:00:00+05:00'); t.setDate(t.getDate() - 7);\n  return (d <= b && d >= Utilities.formatDate(t, TZ, 'yyyy-MM-dd')) ? d : b;\n}\n\nfunction toza_(v, max) { return String(v == null ? '' : v).replace(/\\s+/g, ' ').trim().slice(0, max); }\nfunction son_(v) { var x = parseFloat(String(v == null ? '' : v).replace(/\\s/g, '').replace(',', '.')); return isFinite(x) ? Math.round(x * 100) / 100 : NaN; }\n\n// foydalanuvchi yozgan matn formula bo'lib ishlamasligi uchun (=, +, -, @ bilan boshlansa) oldiga ' qo'yiladi; telefon \"+998\u2026\" ham matn bo'lib qoladi\nfunction xavfsiz_(r) { return r.map(function (v) { return (typeof v === 'string' && /^[=+\\-@]/.test(v)) ? \"'\" + v : v; }); }\n\nfunction papka_() {\n  var it = DriveApp.getFoldersByName(CONFIG.FOLDER);\n  return it.hasNext() ? it.next() : DriveApp.createFolder(CONFIG.FOLDER);\n}\n\nfunction pul_(n, cur) {\n  var s = (Math.round(n * 100) / 100).toFixed(cur === 'UZS' ? 0 : 2).replace(/\\.00$/, '').replace(/\\B(?=(\\d{3})+(?!\\d))/g, ' ');\n  return cur === 'UZS' ? s + \" so'm\" : '$' + s;\n}\n\nfunction tg_(method, payload) {\n  var r = UrlFetchApp.fetch('https://api.telegram.org/bot' + CONFIG.BOT_TOKEN + '/' + method, { method: 'post', payload: payload, muteHttpExceptions: true });\n  return JSON.parse(r.getContentText() || '{}');\n}\n\nfunction telegramUlash_() {\n  var u = tg_('getUpdates', {}).result || [];\n  for (var i = u.length - 1; i >= 0; i--) {\n    var msg = u[i].message;\n    if (msg && msg.chat && msg.chat.type === 'private') {\n      PropertiesService.getScriptProperties().setProperty('CHAT_ID', String(msg.chat.id));\n      return msg.chat.id;\n    }\n  }\n  throw new Error(\"Avval Telegram'da botingizga /start yozing, keyin \u00absozlash\u00bb ni qayta ishga tushiring\");\n}\n\nfunction chat_() {\n  if (!CONFIG.BOT_TOKEN) return null;\n  return PropertiesService.getScriptProperties().getProperty('CHAT_ID') || telegramUlash_();\n}\n\nfunction telegramXabar_(text) {\n  var c = chat_(); if (!c) return;\n  tg_('sendMessage', { chat_id: String(c), text: text });\n}\n\nfunction telegramFayl_(blob, caption) {\n  var c = chat_(); if (!c) return;\n  var r = tg_('sendDocument', { chat_id: String(c), caption: caption.slice(0, 1000), document: blob });\n  if (!r.ok) throw new Error('Telegram: ' + (r.description || 'fayl yuborilmadi'));\n}\n";

  let pop=null,cur=null,vy=0,vm=0;
  function close(){if(pop){pop.remove();pop=null;cur=null}}
  function pick(v){const i=cur;close();if(!i)return;i.value=v;i.dispatchEvent(new Event('input',{bubbles:true}));i.dispatchEvent(new Event('change',{bubbles:true}))}
  function draw(){
    const sel=cur.value,td=nowIso();
    const first=new Date(vy,vm,1);const off=(first.getDay()+6)%7;const dim=new Date(vy,vm+1,0).getDate();const prevDim=new Date(vy,vm,0).getDate();
    let h='<div class="uch"><button type="button" data-n="-12">«</button><button type="button" data-n="-1">‹</button><b>'+MN[vm]+' '+vy+'</b><button type="button" data-n="1">›</button><button type="button" data-n="12">»</button></div><div class="ug">'+WD.map(w=>'<div class="uw">'+w+'</div>').join('');
    for(let i=0;i<42;i++){
      let y=vy,m=vm,d=i-off+1,oth=false;
      if(d<1){m=vm-1;d=prevDim+d;oth=true}else if(d>dim){m=vm+1;d=d-dim;oth=true}
      if(m<0){m=11;y=vy-1}else if(m>11){m=0;y=vy+1}
      const v=iso(y,m,d);
      h+='<button type="button" class="ud'+(oth?' oth':'')+(v===td?' tod':'')+(v===sel?' sel':'')+'" data-d="'+v+'">'+d+'</button>';
    }
    h+='</div><div class="uft"><button type="button" data-clr="1">Tozalash</button><button type="button" data-today="1">Bugun</button></div>';
    pop.innerHTML=h;
  }
  function open(inp){
    close();cur=inp;
    const v=/^\d{4}-\d{2}-\d{2}$/.test(inp.value)?inp.value:nowIso();
    vy=+v.slice(0,4);vm=+v.slice(5,7)-1;
    pop=document.createElement('div');pop.className='uzcal';document.body.appendChild(pop);draw();
    const r=inp.getBoundingClientRect(),w=pop.offsetWidth,hh=pop.offsetHeight;
    let x=Math.min(Math.max(8,r.left),innerWidth-w-8),y=r.bottom+6;
    if(y+hh>innerHeight-8)y=Math.max(8,r.top-hh-6);
    pop.style.left=x+'px';pop.style.top=y+'px';
    pop.onmousedown=e=>e.preventDefault();
    pop.onclick=e=>{
      const b=e.target.closest('button');if(!b)return;
      if(b.dataset.n){const k=vm+(+b.dataset.n);vy+=Math.floor(k/12);vm=((k%12)+12)%12;draw()}
      else if(b.dataset.d)pick(b.dataset.d);
      else if(b.dataset.today)pick(nowIso());
      else if(b.dataset.clr)pick('');
    };
  }
  function enh(el){
    if(el.dataset.uz)return;el.dataset.uz='1';el.readOnly=true;
    el.addEventListener('click',()=>{if(!el.disabled)open(el)});
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();if(!el.disabled)open(el)}});
  }
  const scan=()=>document.querySelectorAll('input[type=date]:not([data-uz])').forEach(enh);
  const start=()=>{scan();new MutationObserver(scan).observe(document.body,{childList:true,subtree:true});
    document.addEventListener('mousedown',e=>{if(pop&&!pop.contains(e.target)&&e.target!==cur)close()},true);
    document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
    addEventListener('scroll',e=>{if(pop&&!pop.contains(e.target))close()},true);addEventListener('resize',close)};
  if(document.body)start();else addEventListener('DOMContentLoaded',start);
})();
start();
</script>
</body>
</html>
